# Natural-language evaluation set.
#
# Each case states what a correct pipeline must produce *after* resolution
# (graph ids, not surface text), so parsers are judged on the outcome that
# matters. Fields left out are not checked.
#   status: answered | needs_clarification | not_found | unsupported
# Groups: sample (the 5 queries shipped with the dataset), template (the 3
# required templates, reworded), variant (typos, slang, reordering),
# edge (ambiguity, unknowns, out of scope).

